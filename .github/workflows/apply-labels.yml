---

name: 🏷️ Add labels

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - master

jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml

...
