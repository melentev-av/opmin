---

# Builds the static opmin binary (scoped PHAR + static-php-cli micro) on native runners:
# every platform is compiled on a machine of its own OS and architecture, no Docker, no emulation.
# Runs only when a version is released (`release: published`, see create-release.yml) or by hand.

name: 📦 Build binaries

on:  # yamllint disable-line rule:truthy
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach binaries to (empty — build only, upload as workflow artifacts).
        required: false
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  # Embedded PHP runs only the orchestrator; the analyzed code always runs under php.binary.
  SPC_PHP_VERSION: '8.4'
  # zlib: the PHAR is GZ-compressed; pcntl/posix: process pool; the rest: Symfony and opmin itself.
  SPC_EXTENSIONS: 'ctype,filter,iconv,mbstring,pcntl,phar,posix,tokenizer,zlib'

jobs:
  # The PHAR is the same for every platform: build it once, on Linux.
  phar:
    name: 📦 PHAR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v5

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-values: 'memory_limit=-1, phar.readonly=0'
          tools: composer, box
          coverage: none

      - name: 🏷️ Write version
        run: |
          [ -z "$RELEASE_TAG" ] || printf '{".": "%s"}\n' "${RELEASE_TAG#v}" > resources/version.json

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--no-dev"

      - name: 📦 Build PHAR
        run: box compile --no-parallel

      - name: 📤 Upload PHAR
        uses: actions/upload-artifact@v4
        with:
          name: phar-for-binaries
          path: .build/phar/opmin.phar
          retention-days: 1
          if-no-files-found: error

  # Each platform is built on a native runner of its own OS and architecture. No PHP is installed
  # here: static-php-cli builds the embedded PHP itself and the smoke test runs the binary alone.
  build:
    name: 📦 ${{ matrix.target }}
    needs: phar
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `binary` is what `file` must report for the result: a build that silently ran on the
          # wrong architecture (e.g. under Rosetta) fails instead of being published.
          - target: linux-x86_64
            runner: ubuntu-24.04
            spc: spc-linux-x86_64
            binary: x86-64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            spc: spc-linux-aarch64
            binary: aarch64
          - target: macos-x86_64
            runner: macos-15-intel
            spc: spc-macos-x86_64
            binary: x86_64
          - target: macos-arm64
            runner: macos-26
            spc: spc-macos-aarch64
            binary: arm64
    env:
      SPC_SKIP_BREW_INSTALL: '1'
      # Binaries built on the newest macOS must still start on older ones.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v5

      - name: 🖥️ Runner architecture
        run: |
          uname -a
          echo "machine: $(uname -m)"
          if [ "$(uname -s)" = Darwin ]; then
            sysctl -n machdep.cpu.brand_string
            echo "translated by Rosetta: $(sysctl -in sysctl.proc_translated || echo 0)"
          fi

      - name: 📥 Download PHAR
        uses: actions/download-artifact@v4
        with:
          name: phar-for-binaries
          path: .build/phar

      - name: 🏷️ Version
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "VERSION=${VERSION:-dev}" >> "$GITHUB_ENV"

      - name: 📥 Download static-php-cli
        run: |
          mkdir -p .build/bin
          curl -fsSL -o .build/bin/spc "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/${{ matrix.spc }}"
          chmod +x .build/bin/spc

      - name: 💾 Cache static-php-cli downloads and build
        uses: actions/cache@v4
        with:
          path: |
            downloads
            buildroot
            pkgroot
          key: spc-${{ matrix.target }}-php${{ env.SPC_PHP_VERSION }}-${{ hashFiles('.github/workflows/build-bin-release.yml') }}

      - name: 🔨 Build micro SAPI
        env:
          # spc downloads sources through the GitHub API: anonymous calls share the runner IP's
          # 60 requests/hour and fail with 403; the job token lifts that limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .build/bin/spc doctor --auto-fix
          [ -f buildroot/bin/micro.sfx ] || {
            .build/bin/spc download --with-php="$SPC_PHP_VERSION" --for-extensions="$SPC_EXTENSIONS" --prefer-pre-built
            .build/bin/spc build "$SPC_EXTENSIONS" --build-micro
          }

      - name: 🔗 Combine micro with the PHAR
        run: |
          chmod +x .build/phar/opmin.phar
          mkdir -p dist
          .build/bin/spc micro:combine .build/phar/opmin.phar --output=dist/opmin
          chmod +x dist/opmin

      - name: 🔍 Check binary architecture
        run: |
          file dist/opmin
          file dist/opmin | grep -q '${{ matrix.binary }}' || { echo "::error::expected ${{ matrix.binary }}"; exit 1; }

      - name: 🤔 Smoke test
        run: |
          dist/opmin --version
          dist/opmin list
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke" && "$GITHUB_WORKSPACE/dist/opmin" init --no-interaction
          test -s "$RUNNER_TEMP/smoke/opmin.yaml"

      - name: 🗜️ Archive
        run: |
          ARCHIVE="opmin-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C dist opmin
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: opmin-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7
          if-no-files-found: error

  # One job attaches every binary: parallel uploads to the same release race and drop assets.
  publish:
    name: 📤 Publish binaries to the release
    needs: build
    if: ${{ !cancelled() && (inputs.tag || github.event.release.tag_name) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opmin-*
          path: dist
          merge-multiple: true

      - name: 🔢 Checksums
        run: cd dist && sha256sum opmin-*.tar.gz > sha256sum.txt

      - name: 📤 Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/sha256sum.txt --clobber --repo "$GITHUB_REPOSITORY"

...
