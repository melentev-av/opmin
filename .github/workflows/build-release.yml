---

# Builds a release: the scoped PHAR and the static opmin binary (PHAR + static-php-cli micro) on native
# runners — every platform is compiled on a machine of its own OS and architecture, no Docker, no emulation.
# Publishes the archives, the PHAR, sha256sum.txt and its signature (sha256sum.txt.sig, checked by
# `opmin self-update` and install.sh), plus GitHub build provenance attestations (`gh attestation verify`).
# Runs only when a version is released (`release: published`, see create-release.yml) or by hand.

name: 📦 Build release

on:  # yamllint disable-line rule:truthy
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach binaries to (empty — build only, upload as workflow artifacts).
        required: false
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  # Embedded PHP runs only the orchestrator; the analyzed code always runs under php.binary.
  SPC_PHP_VERSION: '8.4'
  # zlib: the PHAR is GZ-compressed and self-update unpacks .tar.gz; openssl: HTTPS downloads and the
  # release signature of self-update; pcntl/posix: process pool; the rest: Symfony and opmin itself.
  SPC_EXTENSIONS: 'ctype,filter,iconv,mbstring,openssl,pcntl,phar,posix,tokenizer,zlib'

jobs:
  # The PHAR is the same for every platform: build it once, on Linux.
  phar:
    name: 📦 PHAR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v5

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-values: 'memory_limit=-1, phar.readonly=0'
          tools: composer, box
          coverage: none

      - name: 🏷️ Write version
        run: |
          [ -z "$RELEASE_TAG" ] || printf '{".": "%s"}\n' "${RELEASE_TAG#v}" > resources/version.json

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--no-dev"

      - name: 📦 Build PHAR
        run: |
          box validate box.json.dist --ansi
          box compile --no-parallel
          box info .build/phar/opmin.phar --ansi
          .build/phar/opmin.phar --version

      - name: 📤 Upload PHAR
        uses: actions/upload-artifact@v4
        with:
          name: phar-for-binaries
          path: .build/phar/opmin.phar
          retention-days: 7
          if-no-files-found: error

  # Each platform is built on a native runner of its own OS and architecture. No PHP is installed
  # here: static-php-cli builds the embedded PHP itself and the smoke test runs the binary alone.
  build:
    name: 📦 ${{ matrix.target }}
    needs: phar
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `binary` is what `file` must report for the result: a build that silently ran on the
          # wrong architecture (e.g. under Rosetta) fails instead of being published.
          - target: linux-x86_64
            runner: ubuntu-24.04
            spc: spc-linux-x86_64
            binary: x86-64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            spc: spc-linux-aarch64
            binary: aarch64
          - target: macos-x86_64
            runner: macos-15-intel
            spc: spc-macos-x86_64
            binary: x86_64
          - target: macos-arm64
            runner: macos-26
            spc: spc-macos-aarch64
            binary: arm64
    env:
      SPC_SKIP_BREW_INSTALL: '1'
      # Binaries built on the newest macOS must still start on older ones.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v5

      - name: 🖥️ Runner architecture
        run: |
          uname -a
          echo "machine: $(uname -m)"
          if [ "$(uname -s)" = Darwin ]; then
            sysctl -n machdep.cpu.brand_string
            echo "translated by Rosetta: $(sysctl -in sysctl.proc_translated || echo 0)"
          fi

      - name: 📥 Download PHAR
        uses: actions/download-artifact@v4
        with:
          name: phar-for-binaries
          path: .build/phar

      - name: 🏷️ Version
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "VERSION=${VERSION:-dev}" >> "$GITHUB_ENV"

      - name: 📥 Download static-php-cli
        run: |
          mkdir -p .build/bin
          curl -fsSL -o .build/bin/spc "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/${{ matrix.spc }}"
          chmod +x .build/bin/spc

      - name: 💾 Cache static-php-cli downloads and build
        uses: actions/cache@v4
        with:
          path: |
            downloads
            buildroot
            pkgroot
          key: spc-${{ matrix.target }}-php${{ env.SPC_PHP_VERSION }}-${{ env.SPC_EXTENSIONS }}

      - name: 🔨 Build micro SAPI
        env:
          # spc downloads sources through the GitHub API: anonymous calls share the runner IP's
          # 60 requests/hour and fail with 403; the job token lifts that limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Mirrors of static-php-cli sometimes answer 500: retry downloads before failing the release.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::attempt $i failed: $*"; sleep $((i * 30)); done; return 1; }
          retry .build/bin/spc doctor --auto-fix
          [ -f buildroot/bin/micro.sfx ] || {
            retry .build/bin/spc download --with-php="$SPC_PHP_VERSION" --for-extensions="$SPC_EXTENSIONS" --prefer-pre-built
            .build/bin/spc build "$SPC_EXTENSIONS" --build-micro
          }

      - name: 🔗 Combine micro with the PHAR
        run: |
          chmod +x .build/phar/opmin.phar
          mkdir -p dist
          .build/bin/spc micro:combine .build/phar/opmin.phar --output=dist/opmin
          chmod +x dist/opmin

      - name: 🔍 Check binary architecture
        run: |
          file dist/opmin
          file dist/opmin | grep -q '${{ matrix.binary }}' || { echo "::error::expected ${{ matrix.binary }}"; exit 1; }

      - name: 🤔 Smoke test
        run: |
          dist/opmin --version
          dist/opmin list
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke" && "$GITHUB_WORKSPACE/dist/opmin" init --no-interaction
          test -s "$RUNNER_TEMP/smoke/opmin.yaml"

      # The oldest PHP opmin supports as php.binary: the harness is extracted from the binary and runs under
      # it, while the orchestrator runs on the embedded PHP.
      - name: 🛠️ Setup PHP 8.1 as php.binary
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: opcache
          coverage: none

      - name: 🤔 Harness under an external php.binary
        run: |
          cd "$RUNNER_TEMP/smoke"
          printf '<?php\nfunction twice(int $x): int { return $x * 2; }\n' > a.php
          printf '<?php\nfunction twice(int $x): int { return $x + $x; }\n' > same.php
          printf '<?php\nfunction twice(int $x): int { return $x * 3; }\n' > other.php
          "$GITHUB_WORKSPACE/dist/opmin" count a.php
          "$GITHUB_WORKSPACE/dist/opmin" verify a.php same.php
          if "$GITHUB_WORKSPACE/dist/opmin" verify a.php other.php; then echo "::error::a changed behavior was accepted"; exit 1; fi

      - name: 🗜️ Archive
        run: |
          ARCHIVE="opmin-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C dist opmin
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: opmin-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7
          if-no-files-found: error

  # One job attaches every asset: parallel uploads to the same release race and drop assets.
  # It publishes only when every platform is built: a release without one binary would break install.sh there.
  publish:
    name: 📤 Publish to the release
    needs: [phar, build]
    if: ${{ inputs.tag || github.event.release.tag_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance attestations: a keyless signature by GitHub of what this workflow built.
      id-token: write
      attestations: write
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v5
        with:
          sparse-checkout: resources/release-keys

      - name: 📥 Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opmin-*
          path: dist
          merge-multiple: true

      - name: 📥 Download PHAR
        uses: actions/download-artifact@v4
        with:
          name: phar-for-binaries
          path: dist

      - name: 🔢 Checksums
        run: |
          cd dist
          test "$(ls opmin-*.tar.gz | wc -l)" -eq 4
          sha256sum opmin-*.tar.gz opmin.phar > sha256sum.txt
          cat sha256sum.txt

      # The private key lives only in this step. The signature must verify with a public key opmin ships:
      # otherwise every installed opmin would refuse this release.
      - name: 🔏 Sign checksums
        env:
          OPMIN_SIGNING_KEY: ${{ secrets.OPMIN_SIGNING_KEY }}
        run: |
          [ -n "$OPMIN_SIGNING_KEY" ] || { echo "::error::secret OPMIN_SIGNING_KEY is not set"; exit 1; }
          umask 077
          KEY="$(mktemp)"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$OPMIN_SIGNING_KEY" > "$KEY"
          openssl dgst -sha256 -sign "$KEY" -out dist/sha256sum.txt.sig dist/sha256sum.txt
          for pub in resources/release-keys/*.pub.pem; do
            openssl dgst -sha256 -verify "$pub" -signature dist/sha256sum.txt.sig dist/sha256sum.txt && exit 0
          done
          echo "::error::the signature matches none of resources/release-keys"; exit 1

      - name: 🪪 Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/opmin-*.tar.gz
            dist/opmin.phar

      - name: 📤 Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/opmin.phar dist/sha256sum.txt dist/sha256sum.txt.sig \
            --clobber --repo "$GITHUB_REPOSITORY"

...
