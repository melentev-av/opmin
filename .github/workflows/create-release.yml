---

# Release flow:
#   develop → pull request into master (all checks run) → merge.
#   On a push to master release-please opens/updates a release PR (CHANGELOG.md + version);
#   no builds and no tests run here.
#   Merging the release PR creates the tag and the GitHub release; the `release: published`
#   event then starts build-release.yml (PHAR, binaries, Docker images).
#
# release-please acts as the GitHub App `opmin-release`, not as GITHUB_TOKEN: events created with
# GITHUB_TOKEN start no workflows, so the checks would never run on the release PR and the builds
# would never start for the release.
#
# Setup: repository variable RELEASE_APP_ID and secret RELEASE_APP_PRIVATE_KEY of the App
# (permissions: Contents, Pull requests, Issues — read and write; installed on this repository).

name: 📦 Create release

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  release:
    name: 🎉 release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 🔑 Get the release App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: 🎉 Create release PR or release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/.release-please-config.json
          manifest-file: resources/version.json
          target-branch: master

...
