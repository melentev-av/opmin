---

# Tests run on every push to develop and on every pull request into develop (contributions) and master (releases).
# Nothing runs on a push to master: master only receives release merges.

name: 🧪 Testing

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: testing-${{ github.event.pull_request.number || github.ref }}

jobs:
  testing:
    name: 🧪 PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.3'
          - '8.4'
          - '8.5'
        dependencies:
          - locked
          - highest
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v5

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: 🛠️ Setup problem matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

      - name: 🤖 Validate composer.json and composer.lock
        # --no-check-all: property-testing-core is pinned exactly on purpose (young package, see docs/testing.md).
        run: composer validate --ansi --strict --no-check-all

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: 🧪 Run tests
        run: composer test

  opcodes:
    # Opcode counts depend on the PHP that compiles the code (php.binary), not on the PHP running opmin:
    # the integration tests count with every supported php.binary while opmin itself runs on 8.4.
    name: 🔢 Opcodes with php.binary ${{ matrix.php-binary }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-binary:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v5

      - name: 🛠️ Setup php.binary ${{ matrix.php-binary }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-binary }}
          extensions: opcache
          coverage: none

      - name: 📌 Remember php.binary
        run: |
          echo "OPMIN_TEST_PHP_BINARY=$(readlink -f "$(command -v php)")" >> "$GITHUB_ENV"
          php -v

      - name: 🛠️ Setup PHP 8.4 for opmin
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3

      - name: 🔢 Count opcodes with php.binary ${{ matrix.php-binary }}
        run: |
          "$OPMIN_TEST_PHP_BINARY" -v
          vendor/bin/testo --ansi --no-coverage --suite=integration

  coverage:
    name: 📊 Coverage
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v5

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-values: error_reporting=E_ALL
          coverage: pcov

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3

      - name: 📊 Collect code coverage with Testo
        run: vendor/bin/testo --ansi --coverage --coverage-clover=runtime/coverage/clover.xml

      - name: 📤 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: runtime/coverage/clover.xml
          retention-days: 7

  compile-phar:
    # A cheap check that the scoped PHAR still builds and starts; release assets are built
    # only when a version is released (see build-release.yml).
    name: 📦 PHAR builds and runs
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v5

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-values: 'error_reporting=E_ALL, memory_limit=-1, phar.readonly=0'
          tools: composer, box
          coverage: none

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--no-dev"

      - name: 🔍 Validate configuration for box-project/box
        run: box validate box.json.dist --ansi

      - name: 📦 Build PHAR
        run: box compile --no-parallel

      - name: 🤔 Run opmin.phar
        run: |
          .build/phar/opmin.phar --version
          .build/phar/opmin.phar list
          mkdir -p /tmp/phar-smoke && cd /tmp/phar-smoke && "$GITHUB_WORKSPACE/.build/phar/opmin.phar" init --no-interaction
          test -s /tmp/phar-smoke/opmin.yaml

      # The harness, Rector and PHPStan from inside the PHAR, next to the project's own php-parser and Rector.
      - name: 📦 PHAR in a project with other php-parser and Rector
        run: tests/Phar/composer-project.sh .build/phar/opmin.phar

  action:
    # The composite action of the repository root (action.yml), from this checkout, on a tiny project:
    # the latest release's image counts, so the job proves the action, not the opmin of this commit.
    name: 🎬 GitHub Action runs opmin check
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      GIT: git -c user.name=ci -c user.email=ci@localhost
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v5
        with:
          path: opmin

      - name: 🧱 A project with a baseline and a branch
        run: |
          VERSION="$(jq -r '."."' opmin/resources/version.json)"
          echo "OPMIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          IMAGE="ghcr.io/melentev-av/opmin:$VERSION-php8.3"
          docker pull --quiet "$IMAGE"

          git init -q -b main
          echo '/opmin/' > .gitignore
          mkdir src
          printf '{"name": "fixture/action", "autoload": {"psr-4": {"App\\\\": "src/"}}}\n' > composer.json
          printf '<?php\n\nnamespace App;\n\nfinal class Price\n{\n    public function total(array $items): int\n    {\n        return \\count($items);\n    }\n}\n' > src/Price.php
          docker run --rm -v "$PWD:/app" -w /app "$IMAGE" opmin init --no-interaction --no-skill
          docker run --rm -v "$PWD:/app" -w /app "$IMAGE" opmin baseline
          $GIT add -A && $GIT commit -q -m base
          git update-ref refs/remotes/origin/main HEAD
          git switch -q -c feature

      - name: 🎬 Nothing changed — the check passes
        uses: ./opmin
        with:
          php: '8.3'
          version: ${{ env.OPMIN_VERSION }}
          base: origin/main

      - name: 📈 A function grows
        run: |
          printf '<?php\n\nnamespace App;\n\nfinal class Price\n{\n    public function total(array $items): int\n    {\n        $n = 0;\n        foreach ($items as $item) {\n            $n += $item > 0 ? 1 : 0;\n        }\n        return $n;\n    }\n}\n' > src/Price.php
          $GIT commit -q -am grow

      - name: 🎬 Grown — the check fails
        id: grown
        continue-on-error: true
        uses: ./opmin
        with:
          php: '8.3'
          version: ${{ env.OPMIN_VERSION }}
          base: origin/main

      - name: 🎬 Not at a release tag and no version — the action refuses
        id: no-version
        continue-on-error: true
        uses: ./opmin
        with:
          php: '8.3'

      - name: ✅ The failures are the expected ones
        run: |
          test "${{ steps.grown.outcome }}" = failure
          test "${{ steps.no-version.outcome }}" = failure

...
